<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'vets')}">
<head>
  <meta charset="UTF-8">
  <title>List of Vets</title>
</head>
<body>

<h2 th:text="#{list_of_vets}">List of Vets</h2>

<table class="table table-striped">
  <thead>
  <tr>
    <th>Id</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Specialties</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="vet : ${vets}">
    <td th:text="${vet.id}">1</td>
    <td th:text="${vet.firstName}">Joe</td>
    <td th:text="${vet.lastName}">Buck</td>
    <td>
      <span th:each="specialty, iter : ${vet.specialties}">
        <span th:text="${specialty.description}">Radiology</span><span th:if="${!iter.last}">, </span>
      </span>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>

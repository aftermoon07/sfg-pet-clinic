<!doctype html>
<html th:fragment="layout (template, menu)">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>PetClinic :: a Spring Framework demonstration</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>

<body>
<nav class="navbar navbar-dark bg-dark" role="navigation">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Pet Clinic</a>
        <div>
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/owners/find}">Find Owners</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/vets}">Veterinarians</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <th:block th:include="${template}"/>
</div>

<!-- Bootstrap 5 JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>

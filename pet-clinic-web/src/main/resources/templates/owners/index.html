<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>List of Pets Owners</title>
</head>
<body>

<h2>List of Pets Owners</h2>

<table border="1" style="width: 50%; text-align: left;">
  <thead>
  <tr>
    <th>Id</th>
    <th>First Name</th>
    <th>Last Name</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="owner : ${owners}"> <td th:text="${owner.id}">1</td>
    <td th:text="${owner.firstName}">Michael</td>
    <td th:text="${owner.lastName}">Weston</td>
  </tr>
  </tbody>
</table>

</body>
</html>

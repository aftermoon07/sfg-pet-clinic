<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<head>
  <meta charset="UTF-8"/>
  <title>  Owners</title>
</head>
<body>

<h2> Owners</h2>

<table id="owners" class="table table-striped">
  <thead>
  <tr>
    <th th:text="#{name}" style="width: 180px;">Name</th>
    <th th:text="#{address}" style="width: 200px;">Address</th>
    <th th:text="#{city}">City</th>
    <th th:text="#{telephone}" style="width: 120px">Telephone</th>
    <th th:text="#{pets}">Pets</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="owner : ${owners}">
    <td>
      <span th:text="${owner.firstName}">Michael</span>
      <span th:text="${owner.lastName}">Weston</span>
    </td>
    <td th:text="${owner.address}">123 Main St</td>
    <td th:text="${owner.city}">Miami</td>
    <td th:text="${owner.telephone}">1234567890</td>
    <td>
      <span th:each="pet, iter : ${owner.pets}">
        <span th:text="${pet.name}">Rosco</span><span th:if="${!iter.last}">, </span>
      </span>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
